# 3-slot posting: one section per day posted three ways at three times.
#   morning (12:23 UTC) -> text     afternoon (16:47 UTC) -> image
#   night   (20:11 UTC) -> video (falls back to image when no video is present)
#
# GATED OFF by default. The scheduled crons run only when the repo variable
#   ENABLE_3SLOT == 'true'
# is set (Settings -> Secrets and variables -> Actions -> Variables). Until then
# the scheduled runs trigger but skip, so the existing daily_post.yml keeps running.
#
# EXCEPTION: a manual "Run workflow" (workflow_dispatch) from the main branch
# always runs, even while ENABLE_3SLOT is unset, so a single slot can be tested
# live without arming the crons. Dispatch from any other ref is always ignored so
# the claim's `git push origin HEAD:main` can never fast-forward main to an
# unreviewed branch. A manual test is a REAL run: it posts to the live account and
# advances state.json by one section, so it consumes the next day in sequence (see
# docs/STATE.md). It does not reprint the section daily_post.yml handled today.
#
# CAUTION while daily_post.yml is still enabled: the two posters fence each other
# only by pushing to main, and daily_post notices a 3-slot post only after its
# post_log.json is finalized. A manual test that overlaps a daily_post run (its
# 12:23 / 16:47 / 20:11 UTC windows) can pin and post the SAME day twice. The
# "Pre-flip test fence" step below enforces the safe ordering mechanically; see
# its comment for the exact conditions (daily_post.yml disabled, or today's
# legacy claim terminal AND state advanced past the claimed day, plus a UTC
# midnight re-check in the claim step).
# To go live: set ENABLE_3SLOT=true AND disable daily_post.yml (else double posts).
#
# Idempotency reuses the per-(date,slot) claim fence (see docs/IDEMPOTENCY.md):
# each slot is claimed+pushed BEFORE its post; the day is pinned once per date and
# state advances once per date.

name: Daily Constitution Post (3-slot)

on:
  schedule:
    - cron: "23 12 * * *" # morning -> text
    - cron: "47 16 * * *" # afternoon -> image
    - cron: "11 20 * * *" # night -> video
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot to run (morning|afternoon|night)"
        required: true
        type: choice
        options: [morning, afternoon, night]

concurrency:
  # Date-wide (one group for all slots) so the three slots run one at a time and
  # never race the claim push from the same base. Runs are hours apart, so this
  # adds no practical delay; an overlapping run just queues.
  group: daily-3slot
  cancel-in-progress: false

permissions:
  contents: write
  # actions:read lets the pre-flip test fence ask whether daily_post.yml is
  # disabled (the go-live path disables it before ENABLE_3SLOT is set).
  actions: read

jobs:
  post:
    runs-on: ubuntu-latest
    # Two independent arms, kept separate so a manual dispatch is ALWAYS restricted
    # to the main ref (even after go-live) and a scheduled run always requires the
    # variable:
    #   - schedule: runs only when ENABLE_3SLOT == 'true' (the go-live switch).
    #   - workflow_dispatch: runs only from refs/heads/main, regardless of the
    #     variable, so a single slot can be tested before the crons are armed.
    # The ref restriction matters because the claim step does
    # `git push origin HEAD:main`: a dispatch from a branch ahead of main would
    # otherwise fast-forward main to that branch's unreviewed commits.
    if: >-
      (github.event_name == 'schedule' && vars.ENABLE_3SLOT == 'true')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')

    steps:
      - name: Resolve slot
        id: cfg
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_SLOT: ${{ github.event.inputs.slot }}
        run: |
          case "$EVENT_SCHEDULE" in
            "23 12 * * *") SLOT=morning ;;
            "47 16 * * *") SLOT=afternoon ;;
            "11 20 * * *") SLOT=night ;;
            *) SLOT="$DISPATCH_SLOT" ;;
          esac
          if [ -z "$SLOT" ]; then echo "Could not resolve slot"; exit 1; fi
          echo "SLOT=$SLOT" >> "$GITHUB_OUTPUT"
          echo "Resolved slot: $SLOT"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Pre-flip test fence: a manual test may only proceed when it provably
      # cannot collide with a legacy daily_post publication. All checks fail
      # closed. In order:
      #
      # 0) If daily_post.yml is DISABLED in Actions (the go-live path disables it
      #    before ENABLE_3SLOT is set) and legacy wrote no claim today, there is
      #    nothing to collide with; the test may run with the crons still unarmed.
      #    The workflow state is read via the API (hence actions:read above); an
      #    API error assumes ACTIVE, i.e. fail-closed into checks 1 and 2.
      #
      # 1) While legacy can run, today's legacy claim (claims/<date>.json) must be
      #    terminal (posted*). Until then a legacy window can still fire:
      #    daily_post notices a 3-slot post only once post_log.json lands with our
      #    FINALIZE push, minutes after our claim push, so a legacy cron or manual
      #    legacy run inside that window could claim and post the SAME pinned day.
      #    'none', 'claimed' (legacy may be mid-post right now) and 'failed' (a
      #    later legacy window will retry) are all unsafe. Once terminal, every
      #    later legacy window hard-skips (should_skip_for_claim in bot.py).
      #
      # 2) state.json current_day must have advanced PAST the legacy-claimed day.
      #    The legacy path advances state only on full success (all_success and
      #    not --day in bot.py), so 'posted_unknown' (crashed after posting,
      #    before logging) and 'posted_partial' (lead tweet LIVE, thread
      #    incomplete) leave current_day pointing at a section that may already be
      #    live. pin_day reads current_day, so a test in that state would repost
      #    the very section this fence exists to protect.
      #
      # A verdict is only valid for the UTC date it inspected, so the fence
      # exports FENCE_DATE and the claim step aborts if midnight flipped in
      # between (the new date's legacy claim was never checked). Self
      # deactivating: go-live sets ENABLE_3SLOT, which skips this step.
      - name: Pre-flip test fence
        id: fence
        if: github.event_name == 'workflow_dispatch' && vars.ENABLE_3SLOT != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          DATE="$(date -u +%F)"
          echo "FENCE_DATE=$DATE" >> "$GITHUB_OUTPUT"
          CLAIM="claims/$DATE.json"
          LEGACY_STATE="$(gh api "repos/$REPO/actions/workflows/daily_post.yml" --jq .state 2>/dev/null || echo active)"
          if [ "$LEGACY_STATE" != "active" ] && [ ! -f "$CLAIM" ]; then
            echo "daily_post.yml is $LEGACY_STATE and wrote no claim today; safe to test."
            exit 0
          fi
          if [ ! -f "$CLAIM" ]; then
            STATUS="none"; CLAIM_DAY=""
          else
            STATUS="$(jq -r '.status // "unknown"' "$CLAIM" 2>/dev/null || echo unknown)"
            CLAIM_DAY="$(jq -r '.day // empty' "$CLAIM" 2>/dev/null || echo "")"
          fi
          CURRENT_DAY="$(jq -r '.current_day // empty' state.json 2>/dev/null || echo "")"
          case "$STATUS" in
            posted|posted_partial|posted_unknown) ;;
            *)
              echo "::error::Refusing the manual test: today's legacy claim status is '$STATUS' and daily_post.yml is $LEGACY_STATE."
              echo "Run the test after daily_post.yml has posted today ($CLAIM shows posted*)."
              exit 1 ;;
          esac
          if [ -z "$CURRENT_DAY" ] || [ -z "$CLAIM_DAY" ] || [ "$CURRENT_DAY" = "$CLAIM_DAY" ]; then
            echo "::error::Refusing the manual test: legacy claimed day '$CLAIM_DAY' ($STATUS) but state.json current_day is '$CURRENT_DAY', i.e. state has NOT advanced past it."
            echo "The section the test would pin may already be live (legacy crashed after posting, or posted a partial thread). Check post_log.json and the live account, resolve state.json, then retry."
            exit 1
          fi
          echo "Legacy post for $DATE is terminal ($STATUS) and state advanced past day $CLAIM_DAY; safe to test."

      # 1) Claim this slot BEFORE posting. The push is the fence. The day pin and
      #    the state advance (state.json) are part of this durable commit.
      - name: Claim slot
        id: claim
        env:
          SLOT: ${{ steps.cfg.outputs.SLOT }}
          # Empty when the fence was skipped (scheduled runs / go-live).
          FENCE_DATE: ${{ steps.fence.outputs.FENCE_DATE }}
        run: |
          git config user.name "Constitution Bot"
          git config user.email "bot@users.noreply.github.com"
          CLAIM_DATE="$(date -u +%F)"
          echo "CLAIM_DATE=$CLAIM_DATE" >> "$GITHUB_OUTPUT"
          # A fence verdict is only valid for the date it inspected. If UTC
          # midnight flipped between the fence and this claim, the fence checked
          # yesterday's legacy claim while we are about to claim today; abort
          # before claiming rather than post on a stale verdict.
          if [ -n "$FENCE_DATE" ] && [ "$FENCE_DATE" != "$CLAIM_DATE" ]; then
            echo "::error::UTC date flipped between the pre-flip fence ($FENCE_DATE) and the claim ($CLAIM_DATE). Re-run the test."
            exit 1
          fi
          python bot.py --claim --slot "$SLOT" --date "$CLAIM_DATE"
          git add claims/ state.json
          if git diff --cached --quiet; then
            echo "CLAIM_OK=false" >> "$GITHUB_OUTPUT"
            echo "$SLOT already claimed/posted for $CLAIM_DATE — skipping."
            exit 0
          fi
          git commit -m "Claim $SLOT $CLAIM_DATE"
          # Fast-forward push ONLY (the mutex). Do NOT add 'git pull --rebase' here.
          if git push origin HEAD:main; then
            echo "CLAIM_OK=true" >> "$GITHUB_OUTPUT"
          else
            echo "CLAIM_OK=false" >> "$GITHUB_OUTPUT"
            echo "Claim push rejected — another run owns this slot. Skipping."
            git reset --hard origin/main
          fi

      # 2) Post only if we won the claim. X credentials live ONLY here.
      - name: Post slot
        if: steps.claim.outputs.CLAIM_OK == 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          SLOT: ${{ steps.cfg.outputs.SLOT }}
          CLAIM_DATE: ${{ steps.claim.outputs.CLAIM_DATE }}
        run: python bot.py --post-claimed --slot "$SLOT" --date "$CLAIM_DATE"

      # 3) Record the outcome + persist state/log. Runs even if the post crashed.
      - name: Finalize slot
        if: always() && steps.claim.outputs.CLAIM_OK == 'true'
        env:
          SLOT: ${{ steps.cfg.outputs.SLOT }}
          CLAIM_DATE: ${{ steps.claim.outputs.CLAIM_DATE }}
        run: |
          git config user.name "Constitution Bot"
          git config user.email "bot@users.noreply.github.com"
          python bot.py --finalize --slot "$SLOT" --date "$CLAIM_DATE"
          git add state.json post_log.json claims/
          if git diff --cached --quiet; then
            echo "Nothing to finalize-commit."
          else
            git commit -m "Posted $SLOT $CLAIM_DATE"
            git pull --rebase && git push
          fi
