# Post one section of the U.S. Constitution daily at 9:00 AM ET.
# State is persisted via git commit back to the repo.

name: Daily Constitution Post

on:
  schedule:
    # 5:00 AM Eastern = 10:00 UTC (EST) or 09:00 UTC (EDT)
    # Using 10:00 UTC for EST. Shifts to 6 AM EDT in summer.
    - cron: "0 10 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post today's section
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python bot.py

      - name: Commit updated state
        run: |
          git config user.name "Constitution Bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json post_log.json
          git diff --cached --quiet || git commit -m "📜 Posted day $(python -c 'import json; print(json.load(open("state.json"))["current_day"] - 1)')"
          git push
