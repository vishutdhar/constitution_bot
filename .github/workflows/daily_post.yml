# Post one section of the U.S. Constitution daily during peak engagement.
# Cron times are deliberately off-the-hour to avoid GitHub Actions' shared
# scheduled-runner queue contention at top-of-hour slots, which was causing
# 1–2h drift and occasional runner-acquisition failures (May 2026).
# 12:23 UTC ≈ 8:23 AM EDT (primary). 16:47 UTC ≈ 12:47 PM EDT and
# 20:11 UTC ≈ 4:11 PM EDT are retry windows. The bot is idempotent —
# later runs exit cleanly when today's post already succeeded (see
# already_posted_today() in bot.py). State is persisted via git commit
# back to the repo.

name: Daily Constitution Post

on:
  schedule:
    - cron: "23 12 * * *"
    - cron: "47 16 * * *"
    - cron: "11 20 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

# Prevent overlapping runs (e.g., manual trigger during scheduled run)
concurrency:
  group: daily-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post today's section
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python bot.py

      - name: Commit updated state
        run: |
          git config user.name "Constitution Bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json post_log.json
          git diff --cached --quiet || git commit -m "📜 Posted day $(python -c 'import json; print(json.load(open("state.json"))["current_day"] - 1)')"
          git pull --rebase
          git push
